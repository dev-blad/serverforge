# ─────────────────────────────────────────────────────────────────────────────
# ServerForge — Elite tier (extends Pro)
# Adds: tickets with transcripts, staff area, events stage, support forum,
# followable announcements, member-count stats and a full brand colour scheme.
# ─────────────────────────────────────────────────────────────────────────────
id: elite
extends: pro
name: Elite
tier: elite
version: 1
description: Everything in Pro plus tickets with transcripts, a staff area, events stage, support forum, followable announcements, live member-count stats and a branded colour scheme.

# Announcement (followable) and stage channels require Discord's Community feature.
# ServerForge enables it automatically during the build.
community:
  enabled: true
  rulesChannel: rules
  updatesChannel: staff-chat

# Branded colour scheme: staff roles are derived from the customer's brand colour.
roles:
  - key: owner
    color: '{{brandColor}}'
  - key: admin
    color: '{{brandColorDark}}'
  - key: moderator
    color: '{{brandColorLight}}'
  - key: support
    name: Support Team
    after: moderator
    color: '{{brandColorLight}}'
    hoist: true
    mentionable: true
    permissions:
      - ViewChannel
      - SendMessages
      - ReadMessageHistory
      - ManageMessages
      - ManageThreads
  - key: event-host
    name: Event Host
    after: support
    color: '#9B59B6'
    hoist: true
    permissions: [ViewChannel, SendMessages, ReadMessageHistory, ManageEvents, MuteMembers, MoveMembers]

categories:
  - key: stats
    name: '📊 Server Stats'
    before: start
    overwrites:
      - role: everyone
        allow: [ViewChannel]
        deny: [Connect]
      - role: member
        deny: [Connect]
    channels:
      - key: member-count
        name: '👥 Members: …'
        type: voice

  - key: info
    channels:
      # Followable announcement channel (other servers can "Follow" it).
      - key: announcements
        type: announcement

  - key: events
    name: '🎉 Events'
    after: community
    channels:
      - key: event-info
        name: event-info
        topic: 'Upcoming events, schedules and recaps.'
        overwrites:
          - role: everyone
            deny: [SendMessages]
          - role: event-host
            allow: [SendMessages, MentionEveryone]
      - key: event-stage
        name: Event Stage
        type: stage

  - key: support
    name: '🆘 Support'
    after: events
    channels:
      - key: faq
        name: faq
        type: forum
        topic: 'Search here first! Staff answer common questions as posts.'
        tags:
          - { name: Question, emoji: '❓' }
          - { name: Answered, emoji: '✅', moderated: true }
          - { name: Guide, emoji: '📘', moderated: true }
        overwrites:
          - role: support
            allow: [ManageThreads, ManageMessages]
      - key: open-ticket
        name: open-a-ticket
        topic: 'Need private help from staff? Open a ticket below.'
        overwrites:
          - role: everyone
            deny: [SendMessages, AddReactions]

  - key: tickets
    name: '🎫 Tickets'
    after: support
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: member
        deny: [ViewChannel]
      - role: moderator
        allow: [ViewChannel, SendMessages, ReadMessageHistory, AttachFiles]
      - role: support
        allow: [ViewChannel, SendMessages, ReadMessageHistory, AttachFiles]
    channels: []

  - key: staff
    name: '🔒 Staff'
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: member
        deny: [ViewChannel]
      - role: moderator
        allow: [ViewChannel, SendMessages, ReadMessageHistory, Connect, Speak]
      - role: support
        allow: [ViewChannel, SendMessages, ReadMessageHistory, Connect, Speak]
    channels:
      - key: staff-chat
        name: staff-chat
        topic: 'Private chat for the {{serverName}} team.'
      - key: ticket-logs
        name: ticket-logs
        topic: 'Ticket transcripts are posted here when tickets close.'
        overwrites:
          - role: everyone
            deny: [ViewChannel]
          - role: member
            deny: [ViewChannel]
          - role: moderator
            allow: [ViewChannel, ReadMessageHistory]
            deny: [SendMessages]
          - role: support
            allow: [ViewChannel, ReadMessageHistory]
            deny: [SendMessages]
      - key: staff-voice
        name: Staff Voice
        type: voice

messages:
  - key: staff-welcome
    channel: staff-chat
    embeds:
      - title: '🔒 Staff area'
        color: '{{brandColor}}'
        description: |-
          This category is only visible to {{role:moderator}} and {{role:support}}.

          • Ticket transcripts → {{channel:ticket-logs}}
          • Moderation log → {{channel:mod-log}}
          • Join/leave log → {{channel:join-leave}}
          • Run `/forge status` to see what's enabled, `/forge resync` to repair anything deleted.

modules:
  tickets:
    enabled: true
    panelChannel: open-ticket
    category: tickets
    logChannel: ticket-logs
    staffRoles: [moderator, support]
    buttonLabel: '🎫 Open a ticket'
    maxOpenPerUser: 1
    panelEmbed:
      title: '🎫 Need help?'
      color: '{{brandColor}}'
      description: |-
        Click the button below to open a **private ticket** with the {{serverName}} team.
        Please check {{channel:faq}} first — your answer might already be there!
    welcomeMessage: |-
      Hi {{user}} 👋 Thanks for reaching out to the {{serverName}} team.
      Please describe your issue in as much detail as you can — a staff member will be with you shortly.

  memberStats:
    enabled: true
    channel: member-count
    format: '👥 Members: {count}'

summaryChannel: staff-chat
