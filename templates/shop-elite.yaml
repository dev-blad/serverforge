# ─────────────────────────────────────────────────────────────────────────────
# Shop Elite — everything in Shop Pro, plus:
#   • Product catalogue: /product add posts branded product cards with an Order button
#   • Order tracking: Received → In progress → Completed on a staff board, customer DMs,
#     an "Order Completed" card with a Leave-a-vouch button, and automatic Customer/VIP roles
#   • Giveaways with an Enter button and automatic winner draws
#   • Staff applications form with Accept/Deny review
#   • VIP lounge, FAQ forum, weekly business report, raid alerts, server backup & restore
# Only the differences from Shop Pro are listed here (see TEMPLATES.md → Inheritance).
# ─────────────────────────────────────────────────────────────────────────────
id: shop-elite
extends: shop-pro
name: Shop Elite
tier: elite
version: 1
description: Everything in Shop Pro, plus a product catalogue with Order buttons, full order tracking with automatic Customer and VIP roles, giveaways, staff applications, a VIP lounge, FAQ forum, weekly business reports, raid alerts and server backups.

categories:
  - key: community
    channels:
      - key: giveaways
        name: ﹒ɢɪᴠᴇᴀᴡᴀʏs
        topic: 'Giveaways — click Enter on any giveaway for a chance to win.'
        after: vouches
        overwrites:
          - role: everyone
            allow: [ReadMessageHistory, AddReactions, UseExternalEmojis]
            deny: [SendMessages, CreatePublicThreads, CreatePrivateThreads, SendMessagesInThreads]
          - role: team
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
          - role: bot
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - key: apply
        name: ﹒ᴀᴘᴘʟʏ
        topic: 'Want to join the team? Apply here.'
        after: giveaways
        overwrites:
          - role: everyone
            allow: [ReadMessageHistory]
            deny: [SendMessages, AddReactions, CreatePublicThreads, CreatePrivateThreads]
          - role: team
            allow: [SendMessages, EmbedLinks, ManageMessages]
          - role: bot
            allow: [SendMessages, EmbedLinks, ManageMessages]

  - key: support
    channels:
      - key: faq
        name: ꜰᴀǫ
        type: forum
        topic: 'Answers to common questions. Staff post one question per thread.'
        before: before-you-ticket
        tags:
          - { name: Orders, emoji: '🛒' }
          - { name: Payments, emoji: '💳' }
          - { name: Delivery, emoji: '📦' }
          - { name: Account, emoji: '👤' }

  # Members-only area for VIPs and customers.
  - key: vip-lounge
    name: VIP Lounge
    after: community
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: vip
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            Connect,
            Speak,
          ]
      - role: customer
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            Connect,
            Speak,
          ]
      - role: team
        allow: [ViewChannel, SendMessages, ReadMessageHistory, ManageMessages, Connect, Speak]
      - role: bot
        allow: [ViewChannel, SendMessages, ReadMessageHistory, EmbedLinks]
    channels:
      - key: vip-offers
        name: ﹒ᴠɪᴘ-ᴏꜰꜰᴇʀs
        topic: 'Exclusive deals and early access for customers and VIPs.'
        overwrites:
          - role: vip
            allow: [ViewChannel, ReadMessageHistory, AddReactions]
            deny: [SendMessages]
          - role: customer
            allow: [ViewChannel, ReadMessageHistory, AddReactions]
            deny: [SendMessages]
      - key: vip-chat
        name: ﹒ᴠɪᴘ-ᴄʜᴀᴛ
        topic: 'Chat with other customers and VIPs.'
      - key: vip-voice
        name: ﹒ᴠɪᴘ-ᴠᴏɪᴄᴇ 🔊
        type: voice

  - key: staff
    channels:
      - key: orders
        name: ﹒ᴏʀᴅᴇʀs
        topic: 'Order board — move orders along with the buttons.'
        after: staff-chat
      - key: applications
        name: ﹒ᴀᴘᴘʟɪᴄᴀᴛɪᴏɴs
        topic: 'Staff applications — accept or deny with the buttons.'
        after: orders
      - key: reports
        name: ﹒ʀᴇᴘᴏʀᴛs
        topic: 'Weekly business report, every Monday.'
        after: applications

messages:
  - key: tip-shop
    embeds:
      - title: '🛒 Shop — how it works'
        color: '{{brandColor}}'
        description: |-
          This is your storefront. Staff add products with **`/product add`** — each one gets a branded card with an **Order** button.

          › Customers click **Order**, add any details, and the order lands on {{channel:orders}}
          › Staff move it along: **Start** → **Complete**; the customer gets a DM at each step
          › On completion the customer is asked for a vouch and gets the {{role:customer}} role ({{role:vip}} after 5 orders)

          Members can read and react but not post here.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'
  - key: tip-giveaways
    channel: giveaways
    embeds:
      - title: '🎉 Giveaways — how it works'
        color: '{{brandColor}}'
        description: |-
          Staff start a giveaway with `/giveaway start` (prize, duration like `2d`, number of winners). {{role:ping-giveaways}} is pinged, members click **Enter**, and winners are drawn automatically when it ends.

          `/giveaway end` finishes one early · `/giveaway reroll` draws new winners.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'
  - key: tip-vip
    channel: vip-offers
    embeds:
      - title: '👑 VIP Lounge — what goes here'
        color: '{{brandColor}}'
        description: |-
          Only {{role:customer}} and {{role:vip}} members can see this area — a thank-you for buying.

          › Post exclusive discount codes and early access here
          › Customers get access automatically after their first completed order
          › VIP is given automatically after 5 completed orders
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'
  - key: elite-commands
    channel: staff-chat
    embeds:
      - title: '👑 Your Elite staff commands'
        color: '{{brandColor}}'
        description: |-
          `/product add` · `/product remove` · `/product list` — manage the catalogue in {{channel:shop}}
          `/order create` — log an order from a ticket (the completion card is posted there)
          `/order list` · `/order view` — open orders (move them along in {{channel:orders}})
          `/giveaway start` · `/giveaway end` · `/giveaway reroll`
          `/backup create` · `/backup restore` — snapshot and restore roles, channels and permissions

          Applications arrive in {{channel:applications}}, a weekly report in {{channel:reports}}, and raid alerts in {{channel:bot-logs}}.

modules:
  store:
    catalogueChannel: shop
    ordersChannel: orders
    staffRoles: [team, support-agent]
    currency: '$'
    customerRole: customer
    vipRole: vip
    vipAfterOrders: 5

  giveaways:
    channel: giveaways
    staffRoles: [team]
    pingRole: ping-giveaways

  applications:
    panelChannel: apply
    reviewChannel: applications
    staffRoles: [team]
    acceptRole: support-agent
    title: 'Join the {{serverName}} team'
    buttonLabel: 'Apply now'
    panelEmbed:
      title: '📝 Join the team'
      color: '{{brandColor}}'
      description: |-
        We're looking for friendly, reliable people to help run {{serverName}}.

        Click **Apply now** and answer a few quick questions. We'll DM you the outcome.
    questions:
      - key: about
        label: Tell us about yourself
        style: paragraph
      - key: experience
        label: Any relevant experience?
        style: paragraph
      - key: availability
        label: When are you usually available?
        placeholder: 'e.g. weekday evenings, UK time'
        style: short
      - key: why
        label: Why do you want to join?
        style: paragraph

  reports:
    channel: reports
    day: mon
    hour: 9

  raidAlert:
    channel: bot-logs
    pingRole: team
    joins: 8
    seconds: 60

  backup:
    keep: 5
