# ─────────────────────────────────────────────────────────────────────────────
# ServerForge — Starter tier
# The foundation every other tier builds on. See TEMPLATES.md for the format.
# ─────────────────────────────────────────────────────────────────────────────
id: starter
name: Starter
tier: starter
version: 1
description: Core roles, essential channels, a voice lounge, sensible permissions, and welcome + rules embeds.

defaults:
  brandColor: '#5865F2'

# Roles are listed highest → lowest. ServerForge keeps them in this order (below its own role).
roles:
  - key: owner
    name: Owner
    color: '#F1C40F'
    hoist: true
    permissions: [Administrator]
  - key: admin
    name: Admin
    color: '#E74C3C'
    hoist: true
    permissions: [Administrator]
  - key: moderator
    name: Moderator
    color: '#3498DB'
    hoist: true
    mentionable: true
    permissions:
      - ViewChannel
      - SendMessages
      - ReadMessageHistory
      - ManageMessages
      - ManageThreads
      - ManageNicknames
      - KickMembers
      - BanMembers
      - ModerateMembers
      - MuteMembers
      - DeafenMembers
      - MoveMembers
      - ViewAuditLog
      - MentionEveryone
  - key: bots
    name: Bots
    color: '#95A5A6'
    hoist: true
    permissions: []
  - key: member
    name: Member
    color: '#2ECC71'
    permissions:
      - ViewChannel
      - SendMessages
      - SendMessagesInThreads
      - CreatePublicThreads
      - EmbedLinks
      - AttachFiles
      - AddReactions
      - UseExternalEmojis
      - UseExternalStickers
      - ReadMessageHistory
      - UseApplicationCommands
      - ChangeNickname
      - Connect
      - Speak
      - Stream
      - UseVAD
      - UseEmbeddedActivities

categories:
  - key: info
    name: '📌 Information'
    overwrites:
      # Read-only for everyone, staff can post.
      - role: everyone
        deny: [SendMessages, CreatePublicThreads, CreatePrivateThreads]
      - role: moderator
        allow: [SendMessages]
    channels:
      - key: welcome
        name: welcome
        topic: 'Welcome to {{serverName}}! Start here.'
      - key: rules
        name: rules
        topic: 'The rules of {{serverName}}. By chatting here you agree to them.'
      - key: announcements
        name: announcements
        topic: 'Official news and updates from the {{serverName}} team.'

  - key: community
    name: '💬 Community'
    channels:
      - key: general
        name: general
        topic: 'Chat about anything — keep it friendly!'
      - key: off-topic
        name: off-topic
        topic: 'Memes, random thoughts and everything else.'
        slowmode: 5
      - key: media
        name: media
        topic: 'Share pictures, videos and creations.'
        slowmode: 10

  - key: voice
    name: '🔊 Voice'
    channels:
      - key: lounge
        name: Lounge
        type: voice
        userLimit: 0

messages:
  - key: welcome
    channel: welcome
    embeds:
      - title: 'Welcome to {{serverName}}! 👋'
        color: '{{brandColor}}'
        description: |-
          We're glad you're here. Here's how to get started:

          📜 Read the rules in {{channel:rules}}
          📣 Catch up on news in {{channel:announcements}}
          💬 Say hi in {{channel:general}}
          🔊 Hang out in **Lounge** voice

          Need help? Ping a {{role:moderator}}.
        footer: '{{serverName}} • Powered by ServerForge'
  - key: rules
    channel: rules
    pin: true
    embeds:
      - title: '📜 {{serverName}} Rules'
        color: '{{brandColor}}'
        description: Breaking these rules may result in a warning, mute, kick or ban at the moderators' discretion.
        fields:
          - name: 1. Be respectful
            value: No harassment, hate speech, discrimination or personal attacks.
          - name: 2. No spam
            value: No flooding, excessive caps, unsolicited advertising or DM spam.
          - name: 3. Keep it safe for work
            value: No NSFW, gore or shocking content.
          - name: 4. Use the right channels
            value: Keep conversations on-topic for each channel.
          - name: 5. No impersonation
            value: Don't pretend to be staff, other members or public figures.
          - name: 6. Follow Discord's rules
            value: '[Terms of Service](https://discord.com/terms) and [Community Guidelines](https://discord.com/guidelines) apply.'
          - name: 7. Staff have the final say
            value: If a moderator asks you to stop, please stop. Questions? Ask {{role:moderator}}.
        footer: Last updated {{year}}

modules:
  autoRole:
    enabled: true
    memberRole: member
    botRole: bots
