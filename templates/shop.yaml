# ─────────────────────────────────────────────────────────────────────────────
# Shop — a Discord storefront and support server.
# Based on a capture of the TixBot server (2026-11-12), tidied by hand:
#   • "Upgrade" channel is now "Shop"
#   • "Feature Requests/Bug Reports" category is now "Edit as Required"
#   • the staff team role is named after the buyer's server
#   • TixBot's plan roles replaced with shop roles (VIP, Customer, Partner)
#   • tickets run on TixBot: staff click "Add TixBot" and ServerForge sets it up
#     (ticket types, staff role, categories, transcripts and the ticket menu)
# ─────────────────────────────────────────────────────────────────────────────
id: shop
name: Shop
tier: starter
version: 1
description: A storefront server with an information area, community chat, a shop channel, ticket categories for sales and support, and a private staff area.
defaults:
  brandColor: '#D4843D'

everyone:
  permissions:
    - CreateInstantInvite
    - ViewChannel
    - SendMessages
    - EmbedLinks
    - AttachFiles
    - AddReactions
    - ReadMessageHistory
    - UseExternalEmojis
    - UseExternalStickers
    - UseApplicationCommands
    - ChangeNickname
    - Connect
    - Speak
    - Stream
    - UseVAD
    - CreatePublicThreads
    - SendMessagesInThreads
    - SendVoiceMessages
    - SendPolls

roles:
  - key: team
    name: '{{serverName}} Team'
    color: '{{brandColor}}'
    hoist: true
  - key: support-agent
    name: Support Agent
    color: '#9E6BFF'
    hoist: true
  # Customer roles: give these by hand (or with a shop bot) when someone buys.
  - key: vip
    name: VIP
    color: '#F1C40F'
    hoist: true
  - key: customer
    name: Customer
    color: '#2ECC71'
    hoist: true
  - key: partner
    name: Partner
    color: '#3498DB'
    hoist: true
  - key: member
    name: Member
    color: '#607D8B'
  - key: bot
    name: Bot
    color: '#8799AE'
    hoist: true
    permissions:
      - ViewChannel
      - SendMessages
      - EmbedLinks
      - AttachFiles
      - ReadMessageHistory
      - AddReactions
      - UseExternalEmojis
      - ManageMessages
      - ManageChannels
      - ManageRoles
      - ManageThreads
      - ManageWebhooks
      - ManageNicknames
      - MentionEveryone
      - KickMembers
      - BanMembers
      - ModerateMembers
      - ViewAuditLog
      - Connect
      - Speak
      - MoveMembers

categories:
  # Read-only information. Only the team and bots can post.
  - key: information
    name: Information
    overwrites:
      - role: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny:
          [
            SendMessages,
            AddReactions,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: team
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - role: bot
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
    channels:
      - key: welcome
        name: ﹒ᴡᴇʟᴄᴏᴍᴇ
      - key: announcements
        name: ﹒ᴀɴɴᴏᴜɴᴄᴇᴍᴇɴᴛs
      - key: changelog
        name: ﹒ᴄʜᴀɴɢᴇʟᴏɢ
      - key: status
        name: ﹒sᴛᴀᴛᴜs

  # Open chat. Members can talk and react; links, files and threads are for staff.
  - key: community
    name: Community
    overwrites:
      - role: everyone
        allow: [ViewChannel, SendMessages, AddReactions, ReadMessageHistory, UseExternalEmojis]
        deny:
          [
            EmbedLinks,
            AttachFiles,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: support-agent
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
          ]
      - role: team
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
            MentionEveryone,
          ]
    channels:
      - key: general
        name: ﹒ɢᴇɴᴇʀᴀʟ
      - key: showcase
        name: ﹒sʜᴏᴡᴄᴀsᴇ
      - key: feedback
        name: ﹒ꜰᴇᴇᴅʙᴀᴄᴋ
      - key: shop
        name: ﹒sʜᴏᴘ
      - key: blog
        name: ﹒ʙʟᴏɢ

  # Read before opening a ticket. Staff can post here.
  - key: support
    name: Support
    overwrites:
      - role: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny:
          [
            SendMessages,
            AddReactions,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: support-agent
        allow: [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages]
      - role: team
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - role: bot
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
    channels:
      - key: before-you-ticket
        name: ﹒ʙᴇꜰᴏʀᴇ-ʏᴏᴜ-ᴛɪᴄᴋᴇᴛ
      - key: support-info
        name: ﹒sᴜᴘᴘᴏʀᴛ-ɪɴꜰᴏ

  # Ticket categories: hidden from members (ticket bots add the opener to their own channel).
  - key: sales-enquiries
    name: Sales Enquiries
    overwrites: &ticket-staff-manage
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            ManageRoles,
            MentionEveryone,
          ]
    channels: []

  - key: support-tickets-basic
    name: Support Tickets (Basic)
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            ManageRoles,
            MentionEveryone,
          ]
    channels: []

  - key: support-tickets-escalated
    name: Support Tickets (Escalated)
    overwrites: *ticket-staff-manage
    channels: []

  - key: edit-as-required
    name: Edit as Required
    overwrites: *ticket-staff-manage
    channels: []

  - key: closed-tickets
    name: Closed Tickets
    overwrites: *ticket-staff-manage
    channels: []

  # Private staff area.
  - key: staff
    name: Staff
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            Stream,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            Stream,
            ManageMessages,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            ManageMessages,
            MentionEveryone,
          ]
    channels:
      - key: staff-voice
        name: ﹒sᴛᴀꜰꜰ-ᴠᴏɪᴄᴇ 🔊
        type: voice
      - key: staff-chat
        name: ﹒sᴛᴀꜰꜰ-ᴄʜᴀᴛ
      - key: bot-logs
        name: ﹒ʙᴏᴛ-ʟᴏɢs
      - key: transcripts
        name: ﹒ᴛʀᴀɴsᴄʀɪᴘᴛs
      - key: updates
        name: ﹒ᴜᴘᴅᴀᴛᴇs
      - key: invite-tracker
        name: ﹒ɪɴᴠɪᴛᴇ-ᴛʀᴀᴄᴋᴇʀ

community:
  enabled: true
  rulesChannel: welcome
  updatesChannel: bot-logs

summaryChannel: staff-chat

messages:
  - key: welcome
    channel: welcome
    pin: true
    embeds:
      - title: 'Welcome to {{serverName}}'
        color: '{{brandColor}}'
        description: |-
          Thanks for joining! Here's where to find everything:

          **{{channel:announcements}}** — news and offers
          **{{channel:shop}}** — what we sell and how to order
          **{{channel:support-info}}** — help with an order or a question
          **{{channel:general}}** — chat with the community
        footer: '{{serverName}} • {{year}}'

  - key: before-you-ticket
    channel: before-you-ticket
    pin: true
    embeds:
      - title: 'Before you open a ticket'
        color: '{{brandColor}}'
        description: |-
          To help us help you faster:

          **1.** Check {{channel:announcements}} and {{channel:status}} in case it's a known issue.
          **2.** Have your order number or payment details ready.
          **3.** Open one ticket per issue and describe it in full.
          **4.** Please be patient — a {{role:support-agent}} will reply as soon as possible.

modules:
  autoRole:
    memberRole: member
    botRole: bot
  logging:
    modLog: bot-logs
    joinLeaveLog: bot-logs
  tixbot:
    setupChannel: staff-chat
    panelChannel: support-info
    staffRole: support-agent
    escalationRole: team
    ticketCategory: support-tickets-basic
    escalationCategory: support-tickets-escalated
    closedCategory: closed-tickets
    transcriptChannel: transcripts
    notificationsChannel: bot-logs
    placeholder: Choose Ticket
    panelEmbed:
      author: '{{serverName}}'
      title: '{{serverName}} Support'
      color: '{{brandColor}}'
      description: |-
        Need help? Select a category below and a ticket will be opened for you.

        🛒 **Sales Enquiries**
        Product questions, pricing, availability and placing an order.

        🛠️ **Support Tickets**
        Help with an existing order, delivery, payment or your account.

        ✏️ **Edit as Required**
        Anything else — rename this option in the TixBot dashboard to suit your shop.

        > 💬 Please be as descriptive as possible — it helps us resolve your enquiry faster.
        > ⏱️ Average response time: **under 24 hours**
      footer: '{{serverName}}'
    ticketTypes:
      - key: sales
        name: Sales Enquiries
        emoji: '🛒'
        description: Pricing, products and placing an order
        category: sales-enquiries
      - key: support
        name: Support Tickets
        emoji: '🛠️'
        description: Help with an order, delivery or payment
        category: support-tickets-basic
      - key: other
        name: Edit as Required
        emoji: '✏️'
        description: Anything else
        category: edit-as-required
