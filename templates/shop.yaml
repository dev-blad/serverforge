# ─────────────────────────────────────────────────────────────────────────────
# Shop — a Discord storefront and support server.
# Based on a capture of the TixBot server (2026-11-12), tidied by hand:
#   • "Upgrade" channel is now "Shop"
#   • "Feature Requests/Bug Reports" category is now "Edit as Required"
#   • the staff team role is named after the buyer's server
#   • TixBot's plan roles replaced with shop roles (VIP, Customer, Partner)
#   • tickets run on TixBot: staff get an "Add TixBot" button and setup steps
#     (Pro sets TixBot up automatically — see shop-pro.yaml)
#   • every empty channel gets a short tip on what to post there
# ─────────────────────────────────────────────────────────────────────────────
id: shop
name: Shop
tier: starter
version: 1
description: A storefront server with an information area, community chat, a shop channel, ticket categories for sales and support, and a private staff area.
defaults:
  brandColor: '#D4843D'

everyone:
  permissions:
    - CreateInstantInvite
    - ViewChannel
    - SendMessages
    - EmbedLinks
    - AttachFiles
    - AddReactions
    - ReadMessageHistory
    - UseExternalEmojis
    - UseExternalStickers
    - UseApplicationCommands
    - ChangeNickname
    - Connect
    - Speak
    - Stream
    - UseVAD
    - CreatePublicThreads
    - SendMessagesInThreads
    - SendVoiceMessages
    - SendPolls

roles:
  - key: team
    name: '{{serverName}} Team'
    color: '{{brandColor}}'
    hoist: true
  - key: support-agent
    name: Support Agent
    color: '#9E6BFF'
    hoist: true
  # Customer roles: give these by hand (or with a shop bot) when someone buys.
  - key: vip
    name: VIP
    color: '#F1C40F'
    hoist: true
  - key: customer
    name: Customer
    color: '#2ECC71'
    hoist: true
  - key: partner
    name: Partner
    color: '#3498DB'
    hoist: true
  - key: member
    name: Member
    color: '#607D8B'
  - key: bot
    name: Bot
    color: '#8799AE'
    hoist: true
    permissions:
      - ViewChannel
      - SendMessages
      - EmbedLinks
      - AttachFiles
      - ReadMessageHistory
      - AddReactions
      - UseExternalEmojis
      - ManageMessages
      - ManageChannels
      - ManageRoles
      - ManageThreads
      - ManageWebhooks
      - ManageNicknames
      - MentionEveryone
      - KickMembers
      - BanMembers
      - ModerateMembers
      - ViewAuditLog
      - Connect
      - Speak
      - MoveMembers

categories:
  # Read-only information. Only the team and bots can post.
  - key: information
    name: Information
    overwrites:
      - role: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny:
          [
            SendMessages,
            AddReactions,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: team
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - role: bot
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
    channels:
      - key: welcome
        name: ﹒ᴡᴇʟᴄᴏᴍᴇ
        topic: 'Start here — what {{serverName}} offers and where to find everything.'
      - key: announcements
        name: ﹒ᴀɴɴᴏᴜɴᴄᴇᴍᴇɴᴛs
        topic: 'News, offers, restocks and events from the {{serverName}} team.'
      - key: changelog
        name: ﹒ᴄʜᴀɴɢᴇʟᴏɢ
        topic: "What's new: products, prices and policy updates."
      - key: status
        name: ﹒sᴛᴀᴛᴜs
        topic: 'Are we open? Current order and delivery status.'

  # Open chat. Members can talk and react; links, files and threads are for staff.
  - key: community
    name: Community
    overwrites:
      - role: everyone
        allow: [ViewChannel, SendMessages, AddReactions, ReadMessageHistory, UseExternalEmojis]
        deny:
          [
            EmbedLinks,
            AttachFiles,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: support-agent
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
          ]
      - role: team
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            EmbedLinks,
            AttachFiles,
            ManageMessages,
            ManageThreads,
            CreatePublicThreads,
            SendMessagesInThreads,
            MentionEveryone,
          ]
    channels:
      - key: general
        name: ﹒ɢᴇɴᴇʀᴀʟ
        topic: 'Chat with the {{serverName}} community. Be friendly!'
      - key: showcase
        name: ﹒sʜᴏᴡᴄᴀsᴇ
        topic: 'Completed orders, customer results and reviews.'
        overwrites:
          - role: everyone
            allow:
              [
                ViewChannel,
                SendMessages,
                AddReactions,
                ReadMessageHistory,
                UseExternalEmojis,
                AttachFiles,
                EmbedLinks,
              ]
            deny: [CreatePublicThreads, CreatePrivateThreads, SendMessagesInThreads]
      - key: feedback
        name: ﹒ꜰᴇᴇᴅʙᴀᴄᴋ
        topic: 'Tell us what you think — ideas, suggestions and feedback.'
      - key: shop
        name: ﹒sʜᴏᴘ
        topic: 'Our products and packages — open a Sales Enquiry to order.'
        overwrites:
          - role: everyone
            allow: [ViewChannel, ReadMessageHistory, AddReactions, UseExternalEmojis]
            deny: [SendMessages, CreatePublicThreads, CreatePrivateThreads, SendMessagesInThreads]
          - role: support-agent
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages]
          - role: team
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
          - role: bot
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - key: blog
        name: ﹒ʙʟᴏɢ
        topic: 'Guides, tips and longer posts from the team.'
        overwrites:
          - role: everyone
            allow: [ViewChannel, ReadMessageHistory, AddReactions, UseExternalEmojis]
            deny: [SendMessages, CreatePublicThreads, CreatePrivateThreads, SendMessagesInThreads]
          - role: support-agent
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages]
          - role: team
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
          - role: bot
            allow: [SendMessages, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]

  # Read before opening a ticket. Staff can post here.
  - key: support
    name: Support
    overwrites:
      - role: everyone
        allow: [ViewChannel, ReadMessageHistory]
        deny:
          [
            SendMessages,
            AddReactions,
            CreatePublicThreads,
            CreatePrivateThreads,
            SendMessagesInThreads,
          ]
      - role: support-agent
        allow: [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages]
      - role: team
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
      - role: bot
        allow:
          [SendMessages, AddReactions, EmbedLinks, AttachFiles, ManageMessages, MentionEveryone]
    channels:
      - key: before-you-ticket
        name: ﹒ʙᴇꜰᴏʀᴇ-ʏᴏᴜ-ᴛɪᴄᴋᴇᴛ
        topic: 'Read this before opening a ticket.'
      - key: support-info
        name: ﹒sᴜᴘᴘᴏʀᴛ-ɪɴꜰᴏ
        topic: 'Open a private ticket for sales or support.'

  # Ticket categories: hidden from members (ticket bots add the opener to their own channel).
  - key: sales-enquiries
    name: Sales Enquiries
    overwrites: &ticket-staff-manage
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            ManageRoles,
            MentionEveryone,
          ]
    channels: []

  - key: support-tickets-basic
    name: Support Tickets (Basic)
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            ManageMessages,
            PinMessages,
            ManageChannels,
            ManageRoles,
            MentionEveryone,
          ]
    channels: []

  - key: support-tickets-escalated
    name: Support Tickets (Escalated)
    overwrites: *ticket-staff-manage
    channels: []

  - key: edit-as-required
    name: Edit as Required
    overwrites: *ticket-staff-manage
    channels: []

  - key: closed-tickets
    name: Closed Tickets
    overwrites: *ticket-staff-manage
    channels: []

  # Private staff area.
  - key: staff
    name: Staff
    overwrites:
      - role: everyone
        deny: [ViewChannel]
      - role: support-agent
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            Stream,
          ]
      - role: team
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            Stream,
            ManageMessages,
            MentionEveryone,
          ]
      - role: bot
        allow:
          [
            ViewChannel,
            SendMessages,
            ReadMessageHistory,
            AddReactions,
            EmbedLinks,
            AttachFiles,
            UseExternalEmojis,
            Connect,
            Speak,
            ManageMessages,
            MentionEveryone,
          ]
    channels:
      - key: staff-voice
        name: ﹒sᴛᴀꜰꜰ-ᴠᴏɪᴄᴇ 🔊
        type: voice
      - key: staff-chat
        name: ﹒sᴛᴀꜰꜰ-ᴄʜᴀᴛ
        topic: 'Staff discussion.'
      - key: bot-logs
        name: ﹒ʙᴏᴛ-ʟᴏɢs
        topic: 'Joins, leaves, edits, deletes and moderation actions.'
      - key: transcripts
        name: ﹒ᴛʀᴀɴsᴄʀɪᴘᴛs
        topic: 'Ticket transcripts are saved here when tickets close.'
      - key: updates
        name: ﹒ᴜᴘᴅᴀᴛᴇs
        topic: 'Internal notices for the team.'
      - key: invite-tracker
        name: ﹒ɪɴᴠɪᴛᴇ-ᴛʀᴀᴄᴋᴇʀ
        topic: 'Invite tracking logs.'

community:
  enabled: true
  rulesChannel: welcome
  updatesChannel: bot-logs

summaryChannel: staff-chat

messages:
  - key: welcome
    channel: welcome
    pin: true
    embeds:
      - title: 'Welcome to {{serverName}}'
        color: '{{brandColor}}'
        description: |-
          Thanks for joining! Here's where to find everything:

          **{{channel:announcements}}** — news and offers
          **{{channel:shop}}** — what we sell and how to order
          **{{channel:support-info}}** — help with an order or a question
          **{{channel:general}}** — chat with the community
        footer: '{{serverName}} • {{year}}'

  - key: before-you-ticket
    channel: before-you-ticket
    pin: true
    embeds:
      - title: 'Before you open a ticket'
        color: '{{brandColor}}'
        description: |-
          To help us help you faster:

          **1.** Check {{channel:announcements}} and {{channel:status}} in case it's a known issue.
          **2.** Have your order number or payment details ready.
          **3.** Open one ticket per issue and describe it in full.
          **4.** Please be patient — a {{role:support-agent}} will reply as soon as possible.

  - key: tip-announcements
    channel: announcements
    embeds:
      - title: '📢 Announcements — what goes here'
        color: '{{brandColor}}'
        description: |-
          Use this channel for anything every member should see:

          › New products, restocks and limited offers
          › Sales, discount codes and giveaways
          › Opening hours, holidays and delivery delays
          › Big server news

          Only staff can post here. Ping sparingly — save `@everyone` for things that really matter.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-changelog
    channel: changelog
    embeds:
      - title: '📝 Changelog — what goes here'
        color: '{{brandColor}}'
        description: |-
          Keep a simple running log of changes customers care about:

          › New products or packages added
          › Price changes
          › Updates to your terms, refund or delivery policy

          Tip: start each post with the date, e.g. **12 Nov — Added the Starter Bundle.**
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-status
    channel: status
    embeds:
      - title: '🚦 Status — what goes here'
        color: '{{brandColor}}'
        description: |-
          Let customers know at a glance whether you're taking orders. For example:

          🟢 **Open** — orders are being processed as normal
          🟡 **Busy** — expect delays of up to 24 hours
          🔴 **Closed** — back on Monday

          Edit one pinned message when things change, so customers check here before opening a ticket.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-shop
    channel: shop
    embeds:
      - title: '🛒 Shop — what goes here'
        color: '{{brandColor}}'
        description: |-
          This is your storefront. Post one message per product or package with:

          › **Name** and a short description
          › **What's included**
          › **Price** and any options
          › **Delivery time**
          › **How to order** — open a Sales Enquiry in {{channel:support-info}}

          Members can read and react but not post here. Pin your best sellers.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-showcase
    channel: showcase
    embeds:
      - title: '🏆 Showcase — what goes here'
        color: '{{brandColor}}'
        description: |-
          Social proof sells. Use this channel for:

          › Screenshots of completed orders
          › Customer reviews and vouches
          › Before-and-after results

          Members can post images here too — encourage happy customers to share theirs.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-feedback
    channel: feedback
    embeds:
      - title: '💬 Feedback — what goes here'
        color: '{{brandColor}}'
        description: |-
          Members can suggest improvements and tell you what they think.

          › React ✅ when something's been done and ❌ if it won't happen
          › Reply to good ideas so people know they were heard
          › Keep complaints about orders in tickets instead — point them to {{channel:support-info}}
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-blog
    channel: blog
    embeds:
      - title: '📰 Blog — what goes here'
        color: '{{brandColor}}'
        description: |-
          For longer posts that don't fit in announcements:

          › How-to guides and tips for your products
          › Behind-the-scenes and team news
          › Case studies and success stories

          Members can read and react but not post here.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-support-info
    channel: support-info
    embeds:
      - title: '🎫 Your ticket menu goes here'
        color: '{{brandColor}}'
        description: |-
          Once TixBot is set up, post your ticket menu in this channel so members can open private tickets for sales or support.

          Staff: see the **Set up tickets with TixBot** message in {{channel:staff-chat}} for the steps.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-updates
    channel: updates
    embeds:
      - title: '📋 Staff updates — what goes here'
        color: '{{brandColor}}'
        description: |-
          Internal notices for the team:

          › Rota and availability
          › Policy or pricing changes staff need to know about
          › Reminders and announcements for staff only
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  - key: tip-invite-tracker
    channel: invite-tracker
    embeds:
      - title: '📈 Invite tracker — what goes here'
        color: '{{brandColor}}'
        description: |-
          Add an invite-tracking bot and point its logs to this channel to see who invited whom.

          Great for rewarding members who bring in new customers.
        footer: '📌 Setup tip from ServerForge — delete this message once the channel is set up.'

  # Staff-only: add TixBot and set it up in the dashboard. (Pro sets it up automatically.)
  - key: install-tixbot
    channel: staff-chat
    embeds:
      - title: '🎫 Set up tickets with TixBot'
        color: '{{brandColor}}'
        description: |-
          Your server is ready for tickets — the **Sales Enquiries**, **Support Tickets**, **Edit as Required** and **Closed Tickets** categories are already in place.

          **1.** Click **Add TixBot** below (this server is already selected).
          **2.** Open the **TixBot dashboard** and choose this server.
          **3.** In **Settings**, set the support role to {{role:support-agent}}, new tickets to **Support Tickets (Basic)** and closed tickets to **Closed Tickets**.
          **4.** Set the transcript channel to {{channel:transcripts}}.
          **5.** Create your ticket types, then deploy a ticket menu to {{channel:support-info}}.
        footer: 'Want this done for you automatically? Upgrade to Pro.'
    links:
      - label: Add TixBot
        emoji: '🎫'
        url: 'https://discord.com/oauth2/authorize?client_id=1470445718400663716&permissions=268823632&integration_type=0&scope=bot+applications.commands&guild_id={{guildId}}&disable_guild_select=true'
      - label: TixBot dashboard
        url: 'https://tixbot.gg/dashboard'

modules:
  autoRole:
    memberRole: member
    botRole: bot
  logging:
    modLog: bot-logs
    joinLeaveLog: bot-logs
