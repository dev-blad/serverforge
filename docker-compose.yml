services:
  serverforge:
    build: .
    image: serverforge:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/serverforge.db
    volumes:
      - serverforge-data:/app/data
      # Mount templates so you can add/edit them without rebuilding the image.
      - ./templates:/app/templates

volumes:
  serverforge-data:
